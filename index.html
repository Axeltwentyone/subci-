<style>
  html, body { margin: 0; padding: 0; background: #E9D8AC; overscroll-behavior: none; }
  body { font-family: 'Manrope', sans-serif; }
  #root { min-height: 100vh; min-height: 100dvh; }
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

  /* On a phone (or installed as a PWA) the shell just fills the screen.
     On a wider browser it's presented as a centered, framed phone-width card
     instead of stretching every row edge-to-edge. */
  .app-shell {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
  }
  @media (min-width: 560px) {
    .app-shell {
      margin: 28px auto;
      min-height: 0;
      height: min(900px, calc(100dvh - 56px));
      border-radius: 32px;
      box-shadow: 0 24px 60px rgba(28,27,31,.25), 0 0 0 1px rgba(28,27,31,.06);
    }
  }
</style>
